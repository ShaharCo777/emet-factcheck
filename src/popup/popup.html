<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="logo">✓</span>
      <span class="title">Emet</span>
      <span class="subtitle">בדיקת עובדות בזמן אמת</span>
    </div>

    <div class="status" id="status" style="display:none"></div>

    <div class="hosted-banner" id="hostedBanner">✓ מוכן לשימוש - לא צריך להזין כלום. פשוט לחצו התחל.</div>

    <details class="advanced" id="advancedSection">
      <summary>הגדרות מתקדמות (מפתח API משלכם)</summary>
    <div class="keys-section" id="keysSection">
      <div class="key-field">
        <label class="key-label">שיטת עבודה</label>
        <select class="key-input key-select" id="modelSelect" dir="ltr">
          <optgroup label="ברירת מחדל">
            <option value="hosted">שרת משותף - עובד מיד, ללא מפתח</option>
          </optgroup>
          <optgroup label="מפתח משלכם">
            <option value="gemini:gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Google)</option>
            <option value="gemini:gemini-3.5-flash">Gemini 3.5 Flash (Google, חכם יותר)</option>
            <option value="groq:openai/gpt-oss-120b">GPT-OSS 120B (Groq, חכם)</option>
            <option value="groq:openai/gpt-oss-20b">GPT-OSS 20B (Groq, הכי מהיר)</option>
          </optgroup>
          <optgroup label="Claude (בתשלום)">
            <option value="claude-haiku-4-5">claude-haiku-4-5 (מהיר וזול)</option>
            <option value="claude-sonnet-5">claude-sonnet-5 (מאוזן)</option>
            <option value="claude-opus-4-8">claude-opus-4-8 (החכם ביותר)</option>
          </optgroup>
        </select>
      </div>

      <!-- כל שדות המפתחות מוצגים רק כשבוחרים "מפתח משלכם" -->
      <div id="byoFields">
        <div class="key-field" id="anthropicField">
          <label class="key-label">מפתח Anthropic (חובה)</label>
          <input class="key-input" id="anthropicKey" type="password" placeholder="sk-ant-..." autocomplete="off" dir="ltr"/>
        </div>
        <div class="key-field" id="geminiField" style="display:none">
          <label class="key-label">מפתח Google AI</label>
          <input class="key-input" id="geminiKey" type="password" placeholder="AIza..." autocomplete="off" dir="ltr"/>
          <a class="key-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">← קבלו מפתח בלחיצה (חשבון Google)</a>
        </div>
        <div class="key-field" id="groqField" style="display:none">
          <label class="key-label">מפתח Groq</label>
          <input class="key-input" id="groqKey" type="password" placeholder="gsk_..." autocomplete="off" dir="ltr"/>
          <a class="key-link" href="https://console.groq.com/keys" target="_blank" rel="noopener">← קבלו מפתח</a>
        </div>

        <div class="section-label">🎙 תמלול</div>
        <div class="key-field" id="deepgramField">
          <label class="key-label">השאירו ריק לתמלול עם Gemini, או הזינו מפתח Deepgram לתמלול חי מקצועי + זיהוי דוברים</label>
          <input class="key-input" id="deepgramKey" type="password" placeholder="ריק = Gemini" autocomplete="off" dir="ltr"/>
          <a class="key-link" href="https://console.deepgram.com/signup" target="_blank" rel="noopener">← מפתח Deepgram (כ-200$ קרדיט)</a>
          <button class="backup-btn" id="dgTestBtn">🔎 בדיקת חיבור Deepgram</button>
        </div>

        <div class="section-label">🔎 חיפוש עובדות</div>
        <div class="key-field" id="searchNote" style="display:none">
          <span class="key-hint ok">החיפוש מובנה במודל - אין צורך במפתח נוסף.</span>
        </div>
        <div class="key-field" id="bdKeyField">
          <label class="key-label">מפתח Bright Data (לחיפוש ראיות עם Groq)</label>
          <input class="key-input" id="brightdataKey" type="password" placeholder="Bright Data API token" autocomplete="off" dir="ltr"/>
        </div>
        <div class="key-field" id="bdZoneField">
          <label class="key-label">שם ה-Zone (SERP API)</label>
          <input class="key-input" id="brightdataZone" type="text" placeholder="serp_api" autocomplete="off" dir="ltr"/>
        </div>

        <div class="backup-row" id="backupRow">
          <button class="backup-btn" id="exportBtn" title="שמירת המפתחות לקובץ">⬇ גיבוי מפתחות</button>
          <button class="backup-btn" id="importBtn" title="טעינת מפתחות מקובץ">⬆ שחזור</button>
          <input type="file" id="importFile" accept=".json" style="display:none"/>
        </div>
      </div>

      <div class="key-hint" id="keyHint"></div>
    </div>
    </details>

    <button class="toggle-btn" id="toggleBtn">התחל בדיקת עובדות</button>

    <div class="footer">פועל על סרטוני יוטיוב ואתרי חדשות ישראליים</div>
    <a class="attribution" id="attribution" href="#" target="_blank" rel="noopener" style="display:none"></a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
